[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-tests"
version = "0.1.0"
description = "Run only the tests your diff actually affects."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "coverage>=7.4",
]

[project.optional-dependencies]
pytest = ["pytest>=7.0", "pytest-cov>=4.1"]
dev = ["pytest>=7.0", "pytest-cov>=4.1"]

[project.scripts]
sift = "sift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
